[tox]
envlist = all
skipsdist = true

[testenv]
description = run every test, in parallel (seconds)
deps =
    pytest>=7
    pytest-xdist>=3
    pyte>=0.8
passenv =
    APRSIM
    APRICOSASM_JAR
    JAVA
    HOME
    TERM
commands = pytest -n auto {posargs}

[testenv:all]

[testenv:fast]
description = run only the tests that don't start the simulator
commands = pytest -m "not simulator" {posargs}

[pytest]
testpaths = .
addopts = -ra
python_files = test_*.py
